title: qty cinema
baseurl: "/"

permalink: /:categories/:year/:month/:day/:title/

collections:
  movies:
    output: true
    permalink: /:name/

timezone: America/Toronto

# The CMS derives a post's filename date from publish_date at creation and does
# not re-slug on edit, so a date set in the future freezes into the slug. With
# Jekyll's default (future: false) such a post is silently skipped on every
# build while the deploy still succeeds. Publish them instead.
future: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "content"

# Build settings
plugins:
  - jekyll-feed
sass:
    sass_dir: _sass

# Single exclude list. YAML keeps only the last key of a duplicate pair, so
# splitting this across two blocks silently drops the earlier one.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/